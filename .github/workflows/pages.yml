name: GitHub Pages

on:
  push:
    branches: [main, claude/casual-mobile-browser-game-q21h6h]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Nur die Spieldateien veröffentlichen
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
